# AUTODESPLIEGUE Android (prueba interna): push a develop → AAB firmado → Google Play.
# NOTA: mientras no exista backend DEV desplegado, develop compila con .env.production
# (igual que producción) para no romper la app de los verificadores.
name: android-internal

on:
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".env.production"
      - ".github/workflows/android-release.yml"
      - ".github/workflows/android-internal.yml"
      - "scripts/play_publish.py"

concurrency:
  group: android-internal-${{ github.ref }}
  cancel-in-progress: false # no cancelar: cada build es un version code nuevo

jobs:
  deploy:
    uses: ./.github/workflows/android-release.yml
    with:
      mode: production
      track: internal
    secrets: inherit
