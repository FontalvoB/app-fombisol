# Limpieza: elimina builds antiguos de TestFlight en App Store Connect (API).
# workflow_dispatch con input keep_version (default: el build más nuevo).
# Solo hace DELETE /v1/builds/{id}. IRREVERSIBLE: los builds eliminados no
# se recuperan.
name: asc-delete-builds

on:
  workflow_dispatch:
    inputs:
      keep_version:
        description: "Número de build a CONSERVAR (los demás se eliminan)"
        required: true
        default: "1791492758"

jobs:
  cleanup:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      KEEP_VERSION: ${{ github.event.inputs.keep_version }}
    steps:
      - name: Listar y eliminar builds antiguos
        run: |
          set -e
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > /tmp/AuthKey.p8
          python3 -m pip install --quiet --break-system-packages cryptography
          python3 - <<'PYEOF'
          import base64, json, os, time, urllib.request, urllib.error

          kid = os.environ["ASC_KEY_ID"]
          iss = os.environ["ASC_ISSUER_ID"]
          app_id = os.environ["ASC_APP_ID"]
          keep = os.environ["KEEP_VERSION"].strip()

          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          from cryptography.hazmat.primitives import hashes

          key = load_pem_private_key(open("/tmp/AuthKey.p8", "rb").read(), password=None)

          def b64(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          header = b64(json.dumps({"alg": "ES256", "kid": kid, "typ": "JWT"}).encode())
          now = int(time.time())
          payload = b64(json.dumps({
              "iss": iss, "iat": now - 30, "exp": now + 1200,
              "aud": "appstoreconnect-v1",
          }).encode())
          sig = key.sign(f"{header}.{payload}".encode(), ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(sig)
          token = f"{header}.{payload}.{b64(r.to_bytes(32, 'big') + s.to_bytes(32, 'big'))}"

          def call(url, method="GET"):
              req = urllib.request.Request(url, method=method,
                                           headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode()
                      return resp.status, body
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          base = "https://api.appstoreconnect.apple.com/v1"
          status, body = call(
              f"{base}/builds?filter[app]={app_id}&sort=-uploadedDate&limit=50"
              "&fields[builds]=version,uploadedDate,processingState")
          if status != 200:
              print("HTTP", status, body[:500]); raise SystemExit(1)
          data = json.loads(body)
          to_delete = []
          for b in data.get("data", []):
              a = b["attributes"]
              print(f"build {a['version']}: estado={a['processingState']} subido={a['uploadedDate']}")
              if str(a["version"]) != keep:
                  to_delete.append(b["id"])
          print(f"\nConservar: {keep}. Eliminar: {len(to_delete)} builds.")
          blocked = []
          for bid in to_delete:
              st, body = call(f"{base}/builds/{bid}", "DELETE")
              ok = st == 200
              print(f"DELETE {bid}: HTTP {st} {body[:200] if not ok else 'OK (eliminado)'}")
              if not ok:
                  # Apple ya no permite DELETE de builds por API: expirarlos es manual.
                  blocked.append(bid)
          if blocked:
              print(f"\n⚠ Apple bloquea DELETE ({len(blocked)} builds). Expirarlos MANUAL en:")
              print("  ASC → PeopleNet → TestFlight → Builds → botón ✦/🚫 'Expire build'")
              print("  (o déjalos: cada build expira solo a los 90 días de su subida)")
          PYEOF
