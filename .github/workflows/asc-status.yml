# Diagnóstico: consulta builds reales en App Store Connect (API).
# workflow_dispatch manual. Usa la misma ASC key que el despliegue iOS.
# Solo LECTURA (GET /v1/builds). No modifica nada.
name: asc-status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
    steps:
      - name: Consultar builds (últimos 15)
        run: |
          set -e
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > /tmp/AuthKey.p8
          python3 - <<'PYEOF'
          import base64, json, os, time, urllib.request, urllib.error

          kid = os.environ["ASC_KEY_ID"]
          iss = os.environ["ASC_ISSUER_ID"]
          app_id = os.environ["ASC_APP_ID"]
          key = open("/tmp/AuthKey.p8", "rb").read()

          def b64(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          header = b64(json.dumps({"alg": "ES256", "kid": kid, "typ": "JWT"}).encode())
          now = int(time.time())
          payload = b64(json.dumps({"iss": iss, "iat": now, "exp": now + 1200}).encode())

          # ES256: openssl firma DER; la API exige r||s de 64 bytes
          import subprocess
          sign_input = f"{header}.{payload}".encode()
          der = subprocess.run(
              ["openssl", "dgst", "-sha256", "-sign", "/tmp/AuthKey.p8"],
              input=sign_input, capture_output=True, check=True,
          ).stdout
          # parseo DER: SEQUENCE { INTEGER r, INTEGER s } → r||s de 64 bytes
          pos, seq = 0, der
          assert seq[pos] == 0x30
          pos += 2
          def read_int(buf, p):
              ln = buf[p]; return buf[p+1:p+1+ln], p+1+ln
          raw_r, p = read_int(seq, pos)
          raw_s, p = read_int(seq, p)
          sig = raw_r[-32:].rjust(32, b"\x00") + raw_s[-32:].rjust(32, b"\x00")
          token = f"{header}.{payload}.{b64(sig)}"

          url = (f"https://api.appstoreconnect.apple.com/v1/builds"
                 f"?filter[app]={app_id}&sort=-uploadedDate&limit=15"
                 f"&fields[builds]=version,uploadedDate,processingState,betaAppReviewSubmissionState")
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
              print(f"{'BUILD':>6}  {'ESTADO':<28}  SUBIDO (UTC)")
              for b in data.get("data", []):
                  a = b["attributes"]
                  state = a.get("processingState")
                  review = a.get("betaAppReviewSubmissionState") or "-"
                  print(f"{a.get('version'):>6}  {state:<28}  {a.get('uploadedDate')}  review={review}")
          except urllib.error.HTTPError as e:
              print("HTTP", e.code, e.read().decode()[:500])
          PYEOF
