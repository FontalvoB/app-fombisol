# Diagnóstico: consulta builds reales en App Store Connect (API).
# workflow_dispatch manual. Usa la misma ASC key que el despliegue iOS.
# Solo LECTURA (GET /v1/builds). No modifica nada.
name: asc-status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: macos-26
    timeout-minutes: 10
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
    steps:
      - name: Consultar builds (últimos 15)
        run: |
          set -e
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > /tmp/AuthKey.p8
          python3 - <<'PYEOF'
          import base64, json, os, time, urllib.request, urllib.error, subprocess
          subprocess.run(["python3", "-m", "pip", "install", "--quiet", "--break-system-packages", "cryptography"], check=True)

          kid = os.environ["ASC_KEY_ID"]
          iss = os.environ["ASC_ISSUER_ID"]
          app_id = os.environ["ASC_APP_ID"]

          from cryptography.hazmat.primitives.serialization import load_pem_private_key
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature
          from cryptography.hazmat.primitives import hashes

          key = load_pem_private_key(open("/tmp/AuthKey.p8", "rb").read(), password=None)

          def b64(data: bytes) -> str:
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          header = b64(json.dumps({"alg": "ES256", "kid": kid, "typ": "JWT"}).encode())
          now = int(time.time())
          payload = b64(json.dumps({
              "iss": iss, "iat": now - 30, "exp": now + 1200,
              "aud": "appstoreconnect-v1",
          }).encode())
          sig = key.sign(f"{header}.{payload}".encode(), ec.ECDSA(hashes.SHA256()))
          r, s = decode_dss_signature(sig)
          token = f"{header}.{payload}.{b64(r.to_bytes(32, 'big') + s.to_bytes(32, 'big'))}"

          url = (f"https://api.appstoreconnect.apple.com/v1/builds"
                 f"?filter[app]={app_id}&sort=-uploadedDate&limit=15"
                 f"&fields[builds]=version,uploadedDate,processingState")
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.load(resp)
              print(f"{'BUILD':>6}  {'ESTADO':<28}  SUBIDO (UTC)")
              for b in data.get("data", []):
                  a = b["attributes"]
                  state = a.get("processingState")
                  print(f"{a.get('version'):>6}  {state:<28}  {a.get('uploadedDate')}")
          except urllib.error.HTTPError as e:
              print("HTTP", e.code, e.read().decode()[:500])
          PYEOF
